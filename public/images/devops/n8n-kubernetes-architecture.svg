<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">n8n Kubernetes architecture</title>
  <desc id="desc">Traffic flows from an internet user through Cloudflare DNS, Cloudflare Tunnel, a cloudflared pod, the n8n service, the n8n pod, CloudNativePG PostgreSQL, and persistent volumes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .cloud { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .kube { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .db { fill: #fef3c7; stroke: #fbbf24; stroke-width: 2; filter: url(#shadow); }
      .storage { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; filter: url(#shadow); }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .muted-line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); stroke-dasharray: 8 8; }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 8; }
      .boundary-label { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="760" rx="0" />

  <text class="title" x="72" y="74">n8n on Kubernetes</text>
  <text class="subtitle" x="72" y="109">Cloudflare Tunnel routes public traffic to an internal ClusterIP service; n8n uses CloudNativePG and persistent storage.</text>

  <rect class="boundary" x="42" y="150" width="372" height="450" rx="18" />
  <text class="boundary-label" x="72" y="186">Public edge</text>

  <rect class="boundary" x="456" y="150" width="568" height="450" rx="18" />
  <text class="boundary-label" x="486" y="186">Kubernetes namespace: automation-n8n</text>

  <rect class="boundary" x="1064" y="150" width="332" height="450" rx="18" />
  <text class="boundary-label" x="1094" y="186">Stateful data</text>

  <rect class="box" x="84" y="246" width="248" height="94" rx="12" />
  <text class="label" x="122" y="285">Internet User</text>
  <text class="small" x="122" y="312">Browser request</text>

  <rect class="cloud" x="84" y="408" width="248" height="94" rx="12" />
  <text class="label" x="122" y="447">Cloudflare DNS</text>
  <text class="small" x="122" y="474">n8n.example.com</text>

  <rect class="cloud" x="456" y="326" width="248" height="94" rx="12" />
  <text class="label" x="494" y="365">Cloudflare Tunnel</text>
  <text class="small" x="494" y="392">Outbound connector path</text>

  <rect class="kube" x="776" y="226" width="248" height="94" rx="12" />
  <text class="label" x="814" y="265">cloudflared Pod</text>
  <text class="small" x="814" y="292">Runs inside Kubernetes</text>

  <rect class="kube" x="776" y="394" width="248" height="94" rx="12" />
  <text class="label" x="814" y="433">n8n Service</text>
  <text class="small" x="814" y="460">ClusterIP :5678</text>

  <rect class="kube" x="456" y="502" width="248" height="94" rx="12" />
  <text class="label" x="494" y="541">n8n Pod</text>
  <text class="small" x="494" y="568">Deployment replica: 1</text>

  <rect class="db" x="1112" y="226" width="248" height="94" rx="12" />
  <text class="label" x="1150" y="265">n8n-postgres-rw</text>
  <text class="small" x="1150" y="292">CloudNativePG service</text>

  <rect class="db" x="1112" y="394" width="248" height="94" rx="12" />
  <text class="label" x="1150" y="433">PostgreSQL Pod</text>
  <text class="small" x="1150" y="460">Managed by CloudNativePG</text>

  <rect class="storage" x="1112" y="562" width="248" height="94" rx="12" />
  <text class="label" x="1150" y="601">PostgreSQL PVC</text>
  <text class="small" x="1150" y="628">Database storage</text>

  <rect class="storage" x="456" y="642" width="248" height="70" rx="12" />
  <text class="label" x="494" y="685">n8n Data PVC</text>

  <path class="line" d="M208 340 L208 398" />
  <path class="line" d="M332 455 C388 455 398 373 444 373" />
  <path class="line" d="M704 373 C742 373 746 273 764 273" />
  <path class="line" d="M900 320 L900 382" />
  <path class="line" d="M776 441 C724 441 724 549 716 549" />
  <path class="line" d="M704 549 C880 549 920 273 1100 273" />
  <path class="line" d="M1236 320 L1236 382" />
  <path class="line" d="M1236 488 L1236 550" />
  <path class="muted-line" d="M580 596 L580 630" />

</svg>
